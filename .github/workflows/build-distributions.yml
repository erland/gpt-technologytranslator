name: Build GPT distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag='${{ github.event.release.tag_name }}'
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag must be v<semver>, got: $tag" >&2
              exit 1
            fi
            version="${tag#v}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: python3 scripts/build_distributions.py --version "${{ steps.version.outputs.version }}"

      - name: Validate distributions
        run: python3 scripts/validate_distributions.py --version "${{ steps.version.outputs.version }}"

      - name: Upload Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: technologytranslator-v${{ steps.version.outputs.version }}
          path: dist/*.zip
          retention-days: 14

      - name: Attach ZIP files to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
