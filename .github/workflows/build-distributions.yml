name: Build GPT distributions
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag (optional; empty = build only)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: distributions-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ENGINE_VERSION: '1.6.33'
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate tag and published release
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == false ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG != '' && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML jsonschema
      - name: Install pinned canonical engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/erland/gpt-byggaren/releases/download/v${ENGINE_VERSION}/gpt-byggaren-engine-${ENGINE_VERSION}.zip" -o "$RUNNER_TEMP/engine.zip"
          python scripts/verify_engine.py "$RUNNER_TEMP/engine.zip" "$RUNNER_TEMP/engine"
          python "$RUNNER_TEMP/engine/scripts/selftest_distribution_engine.py" --source "$RUNNER_TEMP/engine"
          python "$RUNNER_TEMP/engine/scripts/install_distribution_engine.py" --source "$RUNNER_TEMP/engine" --project-root .
      - name: Resolve project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ -n "$RELEASE_TAG" ]]; then version="${RELEASE_TAG#v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Validate and build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/check_and_build.sh "$RUNNER_TEMP/engine" "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Upload without overwriting existing assets
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          files=(*.zip SHA256SUMS.txt DELIVERY-MANIFEST.json)
          [[ ${#files[@]} == 8 ]]
          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for file in "${files[@]}"; do
            if grep -Fxq -- "$file" <<< "$existing"; then
              echo "Existing asset: $file; refusing upload" >&2
              exit 1
            fi
          done
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"
